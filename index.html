<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Isometric Tile Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
            #111;
        background-size: 24px 24px;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    .app {
        width: min(900px, 100%);
    }

    h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
    }

    .subtitle {
        margin: 0 0 28px;
        color: #999;
    }

    .panel {
        background: #191919;
        border: 1px solid #303030;
        border-radius: 12px;
        overflow: hidden;
    }

    .controls {
        padding: 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid #303030;
        flex-wrap: wrap;
    }

    input[type="file"] {
        display: none;
    }

    .button {
        border: 1px solid #444;
        background: #252525;
        color: #eee;
        padding: 9px 14px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
        transition: background .15s, border-color .15s;
    }

    .button:hover {
        background: #303030;
        border-color: #555;
    }

    .button.primary {
        background: #3a7d44;
        border-color: #4d9859;
    }

    .button.primary:hover {
        background: #468e50;
    }

    .settings {
        margin-left: auto;
        display: flex;
        gap: 18px;
        align-items: center;
        color: #aaa;
        font-size: 14px;
    }

    .settings label {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    input[type="number"] {
        width: 65px;
        background: #101010;
        border: 1px solid #3a3a3a;
        color: white;
        padding: 7px;
        border-radius: 5px;
    }

    .preview {
        min-height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 45px;
        background:
            linear-gradient(45deg, #222 25%, transparent 25%),
            linear-gradient(-45deg, #222 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #222 75%),
            linear-gradient(-45deg, transparent 75%, #222 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-color: #181818;
        overflow: auto;
    }

    canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: min(70vw, 600px);
        max-height: 500px;
        width: auto;
        height: auto;
        filter: drop-shadow(0 12px 20px rgba(0,0,0,.45));
    }

    .empty {
        text-align: center;
        color: #777;
        user-select: none;
    }

    .empty strong {
        display: block;
        color: #aaa;
        margin-bottom: 5px;
    }

    .info {
        padding: 14px 18px;
        color: #777;
        font-size: 13px;
        border-top: 1px solid #303030;
    }

    @media (max-width: 650px) {
        .settings {
            margin-left: 0;
            width: 100%;
        }

        .preview {
            min-height: 350px;
            padding: 25px;
        }
    }
</style>
<script src="./vendor/gif.js"></script>
</head>

<body>

<div class="app">

    <h1>Minecraft Isometric Tile</h1>
    <p class="subtitle">
        Turn a Minecraft texture into a 45° isometric diamond tile.
    </p>

    <div class="panel">

        <div class="controls">

            <label class="button primary">
                Upload texture
                <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp">
            </label>

            <button id="download" class="button" disabled>
                Download PNG
            </button>

            <button id="downloadGif" class="button" disabled>
                Side texture GIF
            </button>

            <div class="settings">

                <label>
                    Height
                    <input id="height" type="number" value="57.774" min="10" max="100" step="0.1">
                    %
                </label>

                <label>
                    <input id="pixelMode" type="checkbox" checked>
                    Pixel perfect
                </label>

            </div>

        </div>

        <div class="preview" id="preview">
            <div class="empty" id="empty">
                <strong>Upload a Minecraft texture</strong>
                The generated isometric tile will appear here.
            </div>

            <canvas id="canvas" hidden></canvas>
        </div>

        <div class="info">
            The texture is rotated 45° and vertically compressed to create the
            classic diamond-shaped isometric tile.
        </div>

    </div>

</div>

<script>
const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const empty = document.getElementById("empty");
const download = document.getElementById("download");
const downloadGif = document.getElementById("downloadGif");
const heightInput = document.getElementById("height");
const pixelMode = document.getElementById("pixelMode");

let sourceImage = null;

fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
        sourceImage = img;
        URL.revokeObjectURL(url);

        empty.hidden = true;
        canvas.hidden = false;
        download.disabled = false;
        downloadGif.disabled = false;

        generate();
    };

    img.src = url;
});

heightInput.addEventListener("input", generate);
pixelMode.addEventListener("change", generate);

function generate() {
    if (!sourceImage) return;

    const originalW = sourceImage.naturalWidth;
    const originalH = sourceImage.naturalHeight;

    const TARGET_WIDTH = 227;
    const angle = Math.PI / 4;
    const scaleY = Number(heightInput.value) / 100;

    /*
        Minecraft textures are enlarged by a whole-number scale factor
        before rotation. This keeps every source pixel a clean block.
    */
    const originalDiagonal = Math.hypot(originalW, originalH);
    const upscale = originalDiagonal < TARGET_WIDTH
        ? Math.ceil(TARGET_WIDTH / originalDiagonal)
        : 1;

    const w = originalW * upscale;
    const h = originalH * upscale;

    const scaledSource = document.createElement("canvas");
    scaledSource.width = w;
    scaledSource.height = h;

    const sctx = scaledSource.getContext("2d");
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(sourceImage, 0, 0, w, h);

    const outputWidth = TARGET_WIDTH;
    const outputHeight = Math.ceil(outputWidth * scaleY);

    canvas.width = outputWidth;
    canvas.height = outputHeight;

    ctx.clearRect(0, 0, outputWidth, outputHeight);
    ctx.imageSmoothingEnabled = false;

    /*
        Rotate into the exact bounding box of the 45° result.
        No extra transparent border is included, so the diamond is not
        offset or subtly distorted by scaling an oversized square.
    */
    const rotatedWidth = Math.ceil(
        Math.abs(w * Math.cos(angle)) +
        Math.abs(h * Math.sin(angle))
    );
    const rotatedHeight = Math.ceil(
        Math.abs(w * Math.sin(angle)) +
        Math.abs(h * Math.cos(angle))
    );

    const rotated = document.createElement("canvas");
    rotated.width = rotatedWidth;
    rotated.height = rotatedHeight;

    const rctx = rotated.getContext("2d");
    rctx.imageSmoothingEnabled = false;
    rctx.translate(rotatedWidth / 2, rotatedHeight / 2);
    rctx.rotate(angle);
    rctx.drawImage(scaledSource, -w / 2, -h / 2);

    /*
        The rotated diamond is fitted to exactly 227 px wide, then its
        vertical dimension is compressed by the selected percentage.
        Finally, flip it horizontally for Scratch's side-texture layout.
    */
    ctx.save();
    ctx.translate(outputWidth, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(
        rotated,
        0,
        0,
        rotatedWidth,
        rotatedHeight,
        0,
        0,
        outputWidth,
        outputHeight
    );
    ctx.restore();
}

download.addEventListener("click", () => {
    if (!sourceImage) return;

    canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "minecraft-isometric-tile.png";
        a.click();

        URL.revokeObjectURL(url);
    }, "image/png");
});

downloadGif.addEventListener("click", async () => {
    if (!sourceImage) return;

    const frameA = document.createElement("canvas");
    frameA.width = canvas.width;
    frameA.height = canvas.height;
    frameA.getContext("2d").drawImage(canvas, 0, 0);

    const frameB = document.createElement("canvas");
    frameB.width = canvas.width;
    frameB.height = canvas.height;

    const bctx = frameB.getContext("2d");
    bctx.translate(frameB.width, 0);
    bctx.scale(-1, 1);
    bctx.drawImage(canvas, 0, 0);

    const gif = new GIF({
        workers: 2,
        quality: 1,
        width: canvas.width,
        height: canvas.height,
        workerScript: "./vendor/gif.worker.js"
    });

    gif.addFrame(frameA, {delay: 500, copy: true});
    gif.addFrame(frameB, {delay: 500, copy: true});

    gif.on("finished", blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "minecraft-side-texture.gif";
        a.click();
        URL.revokeObjectURL(url);
    });

    gif.render();
});

</script>

</body>
</html>
